<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>

<!-- LOGIN -->

<div id="loginBlock" class="container">

    <h2>Login</h2>

    <input id="loginLogin" placeholder="Login">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="link">
        <a href="javascript:showRegister()">Create account</a>
    </div>

</div>

<!-- REGISTER -->

<div id="registerBlock" class="container hidden">

    <h2>Register</h2>

    <input id="regName" placeholder="Username">
    <input id="regLogin" placeholder="Login">
    <input id="regPassword" type="password" placeholder="Password">

    <button onclick="register()">Register</button>

    <div class="link">
        <a href="javascript:showLogin()">Back to login</a>
    </div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

    <div class="dashboard-header">
        <h2 id="welcomeTitle">My Dashboard</h2>
    </div>

    <!-- HABITS -->

    <section>

        <h3>My Habits</h3>

        <div id="habitList"></div>

        <div class="input-group">
            <input id="habitName" placeholder="Habit name">
            <button onclick="addHabit()">Add Habit</button>
        </div>

        <div class="empty-state" id="emptyState">
            No habits yet
        </div>

    </section>

    <hr>

    <!-- GROUPS -->

    <section>

        <h3>My Groups</h3>

        <div id="groupList"></div>

        <div class="input-group">
            <input id="groupName" placeholder="Group name">
            <button onclick="createGroup()">Create Group</button>
        </div>

        <div class="empty-state" id="emptyGroupState">
            No groups yet
        </div>

    </section>

    <button id="logoutButton" onclick="logout()">
        Logout
    </button>

</div>
<div id="groupDetails" class="container hidden">

    <button onclick="backToDashboard()">
        ← Back
    </button>

    <h2 id="groupTitle"></h2>

    <h3>Members</h3>
    <div id="groupMembers"></div>

    <h3>Habits</h3>
    <div id="groupHabits"></div>

    <hr>

    <div class="input-group">
        <input
                id="groupUserInput"
                placeholder="User login">
        <button onclick="addMemberToOpenedGroup()">
            Add User
        </button>
    </div>

    <div class="input-group">
        <input
                id="groupHabitInput"
                placeholder="Habit name">
        <button onclick="addHabitToOpenedGroup()">
            Add Habit
        </button>
    </div>

</div>

</body>
</html>
