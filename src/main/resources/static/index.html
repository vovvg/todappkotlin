<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>

    <link rel="stylesheet" href="styles.css">

    <script src="script.js"></script>

</head>

<body>

<!-- LOGIN -->

<div id="loginBlock" class="container">

    <h2>Login</h2>

    <input id="loginLogin" placeholder="login">
    <input id="loginPassword" type="password" placeholder="password">

    <button onclick="login()">Login</button>

    <div class="link">
        <a href="javascript:showRegister()">Create account</a>
    </div>

</div>

<!-- REGISTER -->

<div id="registerBlock" class="container hidden">

    <h2>Register</h2>

    <input id="regName" placeholder="username">
    <input id="regLogin" placeholder="login">
    <input id="regPassword" type="password" placeholder="password">

    <button onclick="register()">Register</button>

    <div class="link">
        <a href="javascript:showLogin()">Back to login</a>
    </div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

    <div class="dashboard-header">
        <h2>My Habits</h2>
    </div>

    <div id="habitList"></div>

    <div class="add-habit-container">
        <h3>Add New Habit</h3>
        <div class="input-group">
            <input id="habitName" placeholder="Enter habit name" type="text">
            <button onclick="addHabit()">Add</button>
        </div>
    </div>

    <div class="empty-state" id="emptyState">
        <p>No habits yet. Add your first habit to get started!</p>
    </div>
    <button id="logoutButton" onclick="logout()">Logout</button>
</div>

</body>
</html>
